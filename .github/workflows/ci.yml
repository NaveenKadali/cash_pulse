name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cashpulse_user
          POSTGRES_PASSWORD: cashpulse_password
          POSTGRES_DB: cashpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgres://cashpulse_user:cashpulse_password@localhost:5432/cashpulse_test
          TEST_DATABASE_URL: postgres://cashpulse_user:cashpulse_password@localhost:5432/cashpulse_test
          NODE_ENV: test
        run: npm test
